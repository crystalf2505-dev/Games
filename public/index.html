<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Game</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="game-container">
        <header>
            <h1>Word Game</h1>
            <p>Guess the 5-letter word in 6 attempts!</p>
        </header>
        <div class ="instructions">

        </div>
        <div id = "board" class="board" aria-label="Game board">
            <!-- Game board will be generated here -->
        </div>
        <p id ="message" class="message" role="status" aria-live="polite">Loading game...</p>
        <div id = "keyboard" class="keyboard" aria-label="On-screen keyboard">
            <!-- On-screen keyboard will be generated here -->
        </div>
        <button id="new-game" class="new-game-button">New Game</button>
    </div>
  </body>
</html>
